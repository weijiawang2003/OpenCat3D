[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "opencat3d"
version = "0.1.0"
description = "Minimal fixed-topology cat 3D reconstruction system"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "OpenCat3D contributors" }]
dependencies = [
  "hydra-core>=1.3.2,<2",
  "imageio-ffmpeg>=0.5,<1",
  "numpy>=1.26,<3",
  "omegaconf>=2.3,<3",
  "pillow>=10,<12",
  "pydantic>=2.7,<3",
  "safetensors>=0.4,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]
geometry = [
  "torch>=2.3",
]
reid = [
  "huggingface-hub>=0.24,<1",
  "timm>=1,<2",
  "torch>=2.3",
  "torchvision>=0.18",
  "transformers>=4.44,<5",
]

[project.scripts]
opencat3d = "opencat3d.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/opencat3d", "src/catnet"]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"configs/default.yaml" = "opencat3d/configs/default.yaml"
"models/registry.yaml" = "opencat3d/models/registry.yaml"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
